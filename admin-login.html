<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio desk </title>
  <link rel="icon" href="brand/logo.png" type="image/png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="admin-login">
  <div class="top-bar"></div>
  <main style="min-height:100vh;display:flex;flex-direction:column;justify-content:center">
    <div class="wrap" style="max-width:24rem;padding:3rem 1.25rem">
      <img src="brand/logo.png" alt="RED ZONE" style="width:5rem;height:5rem;object-fit:contain" />
      <h1 class="serif" style="font-size:2.5rem;margin-top:1.25rem">Studio desk</h1>
      <p class="muted" style="margin-top:0.75rem">Private to the owner of RED ZONE. Enter the desk key to publish projects.</p>
      <form data-admin-login style="margin-top:1.75rem">
        <label for="desk-key">Desk key</label>
        <input id="desk-key" name="key" type="password" placeholder="Enter password" autocomplete="current-password" />
        <button type="submit" class="btn" style="width:100%">Enter</button>
      </form>
      <p style="margin-top:1.5rem;font-size:0.85rem"><a href="index.html">← Back to site</a></p>
      <p class="muted" style="margin-top:0.5rem;font-size:0.75rem"></p>
    </div>
  </main>
  <script src="js/data.js"></script>
  <script src="js/books-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
